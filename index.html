<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>첫인상표</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root{--text:#111;--muted:#999;--line:#e8e8e8;--soft:#f7f7f7}
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;background:#fff;color:var(--text);font-family:"Pretendard",sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}
    button{font-family:"Pretendard",sans-serif}
    .wrap{width:min(1200px,calc(100% - 40px));margin:0 auto;padding:56px 0 90px}
    .home-header{padding:28px 0 30px}
    .eyebrow{margin:0 0 10px;font-size:12px;font-weight:800;letter-spacing:.12em;color:#aaa}
    h1{margin:0;font-size:clamp(44px,7vw,82px);line-height:.95;letter-spacing:-.075em;font-weight:900}
    
    .controls{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:18px}
    .gender-tabs{display:flex;gap:6px}
    .gender-tab{border:0;background:#f4f4f4;color:#888;border-radius:999px;padding:9px 16px;font-size:13px;font-weight:650;cursor:pointer}
    .gender-tab.active{background:#111;color:#fff}
    .search-box{height:40px;min-width:260px;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:0 14px;color:#aaa}
    .search-box span{font-size:20px;line-height:1}
    .search-box input{width:100%;border:0;outline:0;background:transparent;font-size:13px;color:#111}
    .group-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
    .group-card{position:relative;min-height:180px;padding:28px 30px;background:#fff;border:1px solid var(--line);border-radius:16px;text-align:left;cursor:pointer;transition:transform .18s ease,border-color .18s ease,background .18s ease;overflow:hidden}
    .group-card:hover{transform:translateY(-3px);border-color:#111;background:#fafafa}
    .card-name{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:clamp(24px,3vw,40px);font-weight:700;letter-spacing:-.06em;white-space:nowrap}
    input, textarea, [contenteditable="true"]{font-size:16px !important;}
    @media(max-width:760px){input,textarea,[contenteditable="true"]{font-size:16px !important;}}
    .table-view{padding-top:8px}
    .back-btn{appearance:none;border:0;background:transparent;padding:8px 0;color:#888;font-size:13px;font-weight:700;cursor:pointer}
    .back-btn:hover{color:#111}
    .table-title{padding:35px 0 38px}
    .table-title h1{font-size:clamp(38px,6vw,68px)}
    .table-head,.member-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);column-gap:40px}
    .table-head{align-items:end;margin-bottom:10px;padding:0 0 7px}
    .table-head > :nth-child(3),.member-row > :nth-child(3){margin-left:0}
    .head-label{font-size:16px;font-weight:800;letter-spacing:-.04em}
    #members{display:flex;flex-direction:column;gap:14px}
    .member-row{height:260px;align-items:stretch}
    .profile{min-width:0;min-height:0;display:block;padding:0}
    .profile-photo,.impression-photo{position:relative;overflow:hidden;background:linear-gradient(135deg,#f1f1f1,#fafafa)}
    .profile-photo{width:100%;height:100%;border-radius:10px}
    .profile-photo img,.impression-photo img{width:100%;height:100%;display:block;object-fit:cover}
    .profile-placeholder,.photo-placeholder{position:absolute;inset:0;display:grid;place-items:center;color:#b4b4b4;font-weight:800;user-select:none}
    .profile-placeholder{font-size:32px}
    .profile-info{min-width:0}
    .member-name{display:none}
    .group-name{display:none}
    .impression{position:relative;min-width:0;height:260px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fafafa}
    .impression-photo{position:absolute;inset:0}
    .photo-placeholder{flex-direction:column;gap:5px;color:#c3c3c3;font-size:13px;font-weight:700}
    .photo-placeholder b{font-size:25px;font-weight:400;line-height:1}
    .photo-placeholder span{font-size:10px;font-weight:500;color:#aaa}
    .upload-label{position:absolute;right:9px;bottom:9px;z-index:2;display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.92);border:1px solid rgba(0,0,0,.1);color:#111;font-size:17px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.08)}
    .upload-label:hover{transform:scale(1.05)}
    .no-result{padding:70px 0;text-align:center;color:#aaa;font-size:14px}
    .upload-input{display:none}
    [hidden]{display:none!important}
    @media(max-width:760px){
      .wrap{width:min(100% - 24px,680px);padding-top:28px}
      .home-header{padding:18px 0 24px}
      .controls{display:block;margin-bottom:12px}
      .gender-tabs{margin-bottom:10px}
      .search-box{min-width:0;width:100%}
      .group-grid{gap:8px}
      .group-card{min-height:135px;padding:18px;border-radius:12px}
      .card-name{font-size:20px}
      .table-title{padding:26px 0 28px}
      .table-head,.member-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) minmax(0,1fr);column-gap:14px}
      .head-label{font-size:14px}
      .table-head > :nth-child(3),.member-row > :nth-child(3){margin-left:0}
      .member-row{height:150px}
      .impression{height:150px}
      .profile-photo{height:150px}
      .upload-label{width:26px;height:26px;right:6px;bottom:6px}
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section id="homeView" class="home-view">
      <header class="home-header">
        <div>
          <p class="eyebrow">FIRST IMPRESSION</p>
          <h1>첫인상표</h1>
          
        </div>
      </header>
      <div class="controls">
        <div class="gender-tabs" id="genderTabs">
          <button class="gender-tab active" data-gender="male">남돌</button>
          <button class="gender-tab" data-gender="female">여돌</button>
        </div>
        <label class="search-box">
          <span>⌕</span>
          <input id="searchInput" type="search" placeholder="그룹 또는 멤버 검색" autocomplete="off" />
        </label>
      </div>
      <div class="group-grid" id="groupGrid"></div>
      <p class="no-result" id="noResult" hidden>검색 결과가 없습니다.</p>
    </section>

    <section id="tableView" class="table-view" hidden>
      <button class="back-btn" id="backBtn" type="button">← 그룹 목록</button>
      <header class="table-title">
        <div>
          <p class="eyebrow" id="selectedEyebrow">FIRST IMPRESSION</p>
          <h1 id="selectedGroupName"></h1>
        </div>
      </header>

      <section aria-label="첫인상표">
        <div class="table-head">
          <div class="head-label">멤버</div>
          <div class="head-label">첫인상</div>
          <div class="head-label">현인상</div>
        </div>
        <div id="members"></div>
      </section>
    </section>
  </main>

  <script>
    const groups = [
      { id:"bts", name:"BTS", gender:"male", members:[["RM",""],["진",""],["슈가",""],["제이홉",""],["지민",""],["뷔",""],["정국",""]] },
      { id:"blackpink", name:"BLACKPINK", gender:"female", members:[["지수",""],["제니",""],["로제",""],["리사",""]] },
      { id:"seventeen", name:"SEVENTEEN", gender:"male", members:[["에스쿱스",""],["정한",""],["조슈아",""],["준",""],["호시",""],["원우",""],["우지",""],["디에잇",""],["민규",""],["도겸",""],["승관",""],["버논",""],["디노",""]] },
      { id:"twice", name:"TWICE", gender:"female", members:[["나연",""],["정연",""],["모모",""],["사나",""],["지효",""],["미나",""],["다현",""],["채영",""],["쯔위",""]] },
      { id:"straykids", name:"Stray Kids", gender:"male", members:[["방찬",""],["리노",""],["창빈",""],["현진",""],["한",""],["필릭스",""],["승민",""],["아이엔",""]] },
      { id:"ive", name:"IVE", gender:"female", members:[["안유진",""],["가을",""],["레이",""],["장원영",""],["리즈",""],["이서",""]] },
      { id:"aespa", name:"aespa", gender:"female", members:[["카리나",""],["윈터",""],["지젤",""],["닝닝",""]] },
      { id:"lesserafim", name:"LE SSERAFIM", gender:"female", members:[["사쿠라",""],["김채원",""],["허윤진",""],["카즈하",""],["홍은채",""]] },
      { id:"ateez", name:"ATEEZ", gender:"male", members:[["홍중",""],["성화",""],["윤호",""],["여상",""],["산",""],["민기",""],["우영",""],["종호",""]] },
      { id:"riize", name:"RIIZE", gender:"male", members:[["쇼타로",""],["은석",""],["성찬",""],["원빈",""],["소희",""],["앤톤",""]] }
    ];

    const homeView = document.getElementById("homeView");
    const tableView = document.getElementById("tableView");
    const groupGrid = document.getElementById("groupGrid");
    const genderTabs = document.getElementById("genderTabs");
    const searchInput = document.getElementById("searchInput");
    const noResult = document.getElementById("noResult");
    let activeGender = "male";
    let searchTerm = "";
    const membersEl = document.getElementById("members");
    const selectedGroupName = document.getElementById("selectedGroupName");
    const backBtn = document.getElementById("backBtn");

    function initials(name) { return name.slice(0,1); }
    const conceptPhotos = {
      bts: "https://garlandlyn.com/wp-content/uploads/2026/01/01-SQUARE-BOOKLET-OPEN-SILVER-BACKGROUND_2500-scaled.jpg",
      blackpink: "https://vstatic.vietnam.vn/vietnam/resource/IMAGE/2026/02/26/1772087310720_blackpink-visual-poster-deadline-ver-bzvn-1jpg-1772082462045.jpeg",
      aespa: "https://news.nateimg.co.kr/orgImg/ez/2026/01/15/20260115104103_2281948_1200_1800.jpg",
      lesserafim: "https://cdn.kpopping.com/kpics/2026/04/1777191373790-i6960v-0.jpg",
      ateez: "https://img.tf.co.kr/article/home/2026/06/02/202643331780368067.jpg",
      riize: "https://phinf.wevpstatic.net/MjAyNjA1MzFfMjkz/MDAxNzgwMTU1MzEzOTc3.5ES_k3bBV5loprIHNapNnuaItlmMeQ7OU22Ioz0aRwg.PbchAWnXC6Bg5p8ioQ5Z5QaRKXuLkuSJs1N26OmiSkYg.JPEG/1116edf9-f011-41ef-b6af-66969e836515.jpeg?type=w670"
    };

    function storageKey(groupId, memberIndex, type) {
      return "firstimpression:" + groupId + ":" + memberIndex + ":" + type;
    }

    function openGroup(group) {
      localStorage.setItem("firstimpression:view", "table");
      localStorage.setItem("firstimpression:selectedGroup", group.id);
      selectedGroupName.textContent = group.name;
      renderMembers(group);
      homeView.hidden = true;
      tableView.hidden = false;
      window.scrollTo({top:0, behavior:"smooth"});
    }

    function closeGroup() {
      localStorage.setItem("firstimpression:view", "home");
      localStorage.removeItem("firstimpression:selectedGroup");
      tableView.hidden = true;
      homeView.hidden = false;
      window.scrollTo({top:0, behavior:"smooth"});
    }

    function renderHome() {
      groupGrid.innerHTML = "";
      const term = searchTerm.trim().toLocaleLowerCase("ko-KR");
      const filtered = groups.filter(group => {
        const genderMatch = group.gender === activeGender;
        const searchMatch = !term ||
          group.name.toLocaleLowerCase("ko-KR").includes(term) ||
          group.members.some(([name]) => name.toLocaleLowerCase("ko-KR").includes(term));
        return genderMatch && searchMatch;
      });

      filtered.forEach((group, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "group-card";
        button.innerHTML =
          '<span class="card-name">' + group.name + '</span>';
        button.addEventListener("click", () => openGroup(group));
        groupGrid.appendChild(button);
      });
      noResult.hidden = filtered.length !== 0;
    }

    async function getWikiPhoto(groupName, memberName) {
      const key = "wikiProfile:v3:" + groupName + ":" + memberName;
      const cached = localStorage.getItem(key);
      if (cached) return cached === "NONE" ? "" : cached;

      // 그룹명과 멤버명을 함께 검색하면 그룹 대표사진이 잡힐 수 있으므로
      // 멤버 개인 문서를 먼저 정확하게 검색한다.
      const searches = [
        memberName,
        memberName + " " + groupName
      ];

      try {
        for (const term of searches) {
          const query = encodeURIComponent(term);
          const url = "https://ko.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch=" + query +
            "&gsrnamespace=0&gsrlimit=10&prop=pageimages&piprop=thumbnail&pithumbsize=500&format=json&origin=*";
          const response = await fetch(url);
          const data = await response.json();
          const pages = Object.values(data.query?.pages || {});
          const normalizedMember = memberName.replace(/\s+/g, "").toLowerCase();
          const normalizedGroup = groupName.replace(/\s+/g, "").toLowerCase();

          const candidates = pages.filter(page => {
            if (!page.thumbnail?.source) return false;
            const title = (page.title || "").replace(/\s+/g, "").toLowerCase();
            if (title === normalizedGroup || title.includes(normalizedGroup)) return false;
            return title === normalizedMember ||
              title.startsWith(normalizedMember) ||
              title.includes(normalizedMember);
          });

          if (candidates.length) {
            const image = candidates[0].thumbnail.source;
            localStorage.setItem(key, image);
            return image;
          }
        }

        localStorage.setItem(key, "NONE");
        return "";
      } catch (error) {
        return "";
      }
    }

    function makePhoto(groupId, memberIndex, type, title, savedImage) {
      const box = document.createElement("div");
      box.className = "impression";
      const photo = document.createElement("div");
      photo.className = "impression-photo";
      const img = document.createElement("img");
      img.alt = title;
      img.style.display = "none";
      const placeholder = document.createElement("div");
      placeholder.className = "photo-placeholder";
      placeholder.innerHTML = '<b>+</b><span>' + title + ' 사진 추가</span>';

      const input = document.createElement("input");
      input.className = "upload-input";
      input.type = "file";
      input.accept = "image/*";

      const label = document.createElement("label");
      label.className = "upload-label";
      label.title = title + " 사진 추가";
      label.textContent = "+";
      label.appendChild(input);

      function show(src) {
        if (!src) {
          img.style.display = "none";
          placeholder.style.display = "grid";
          return;
        }
        img.src = src;
        img.style.display = "block";
        placeholder.style.display = "none";
      }

      input.addEventListener("change", () => {
        const file = input.files && input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const src = reader.result;
          try { localStorage.setItem(storageKey(groupId, memberIndex, type), src); } catch(e) {}
          show(src);
        };
        reader.readAsDataURL(file);
      });

      if (savedImage) show(savedImage);
      photo.append(img, placeholder);
      box.append(photo, label);
      return box;
    }

    function renderMembers(group) {
      membersEl.innerHTML = "";
      group.members.forEach(([name, profile], index) => {
        const row = document.createElement("article");
        row.className = "member-row";

        const profileCol = document.createElement("div");
        profileCol.className = "profile";

        const profilePhoto = document.createElement("div");
        profilePhoto.className = "profile-photo";
        const profileImg = document.createElement("img");
        profileImg.alt = name + " 프로필";
        profileImg.style.display = profile ? "block" : "none";

        const profilePlaceholder = document.createElement("div");
        profilePlaceholder.className = "profile-placeholder";
        profilePlaceholder.textContent = initials(name);
        profilePlaceholder.style.display = profile ? "none" : "grid";

        if (profile) {
          profileImg.src = profile;
          profileImg.onerror = () => {
            profileImg.style.display = "none";
            profilePlaceholder.style.display = "grid";
          };
        } else {
          getWikiPhoto(group.name, name).then(src => {
            if (!src) return;
            profileImg.src = src;
            profileImg.style.display = "block";
            profilePlaceholder.style.display = "none";
            profileImg.onerror = () => {
              profileImg.style.display = "none";
              profilePlaceholder.style.display = "grid";
            };
          });
        }

        profilePhoto.append(profileImg, profilePlaceholder);

        const info = document.createElement("div");
        info.className = "profile-info";
        info.innerHTML = '<div class="member-name">' + name + '</div><div class="group-name">' + group.name + '</div>';
        profileCol.append(profilePhoto, info);

        const firstSaved = localStorage.getItem(storageKey(group.id,index,"first"));
        const currentSaved = localStorage.getItem(storageKey(group.id,index,"current"));

        row.append(
          profileCol,
          makePhoto(group.id,index,"first","첫인상",firstSaved),
          makePhoto(group.id,index,"current","현인상",currentSaved)
        );
        membersEl.appendChild(row);
      });
    }

    backBtn.addEventListener("click", closeGroup);

    genderTabs.addEventListener("click", (event) => {
      const button = event.target.closest(".gender-tab");
      if (!button) return;
      activeGender = button.dataset.gender;
      genderTabs.querySelectorAll(".gender-tab").forEach(tab => tab.classList.toggle("active", tab === button));
      renderHome();
    });

    searchInput.addEventListener("input", () => {
      searchTerm = searchInput.value;
      renderHome();
    });

    renderHome();

    // 새로고침해도 현재 보고 있던 화면을 그대로 유지
    const savedView = localStorage.getItem("firstimpression:view");
    const savedGroupId = localStorage.getItem("firstimpression:selectedGroup");
    if (savedView === "table" && savedGroupId) {
      const savedGroup = groups.find(group => group.id === savedGroupId);
      if (savedGroup) {
        selectedGroupName.textContent = savedGroup.name;
        renderMembers(savedGroup);
        homeView.hidden = true;
        tableView.hidden = false;
      }
    }
  </script>
</body>
</html>
